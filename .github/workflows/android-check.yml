# TEMPORARY: runs release.yml's android job on this branch, to check it before merging. Delete before the PR.
name: Android check
on:
  push:
    branches: [fix/android-sdk-setup]
permissions:
  contents: read
env:
  NODE_VERSION: 22
jobs:
  android:
    name: Build the Android APK
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        env:
          VERSION: 0.3.3
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$version" = "$VERSION" || { echo "Tag v$VERSION but tauri.conf.json says $version"; exit 1; }
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image has the Android SDK and its sdkmanager. Accept the licences (so Gradle may fetch build tools),
      # then install the platform the app compiles against (compileSdk in app/build.gradle.kts) and the NDK the Rust
      # code links with: the same ones a local build uses.
      - name: Android SDK packages
        env:
          PLATFORM: platforms;android-37.0
          NDK: 29.0.14206865
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install "$PLATFORM" "ndk;$NDK" >/dev/null
          test -d "$ANDROID_HOME/ndk/$NDK" || { echo "::error::NDK $NDK didn't install"; exit 1; }
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK" >> "$GITHUB_ENV"
      # ARM for phones, tablets and most Chromebooks; x86_64 for Intel and AMD Chromebooks (and the emulator).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      # The same key as every APK so far (and the other campaign apps): Android only installs an update over the app
      # when it is signed with the key the installed copy was.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets (see the README's Releases section)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "password=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > src-tauri/gen/android/keystore.properties
      - name: Build
        run: npm run tauri android build -- --apk --target aarch64 --target x86_64
      - name: Name the APK
        env:
          VERSION: 0.3.3
        run: |
          set -euo pipefail
          mkdir apk
          mv src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "apk/Dungeon.Books_${VERSION}_universal.apk"
          rm -f src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/release.jks"
          ls -l apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 7

